<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart-Movies</title>

<style>
:root{
    --bg:#121212;
    --panel:#1b1b1b;
    --card:#202020;
    --card2:#272727;
    --cyan:#00bcd4;
    --cyan2:#00e5ff;
    --text:#ffffff;
    --muted:#aaaaaa;
    --border:#333333;
    --danger:#ff5555;
    --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,Roboto,Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

#loading{
    position:fixed;
    inset:0;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    font-size:18px;
    color:var(--cyan2);
}

#app{
    display:none;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:70px;
    background:rgba(18,18,18,.96);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    backdrop-filter:blur(10px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-mark{
    width:42px;
    height:42px;
    border-radius:12px;
    background:var(--cyan);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#000;
    font-weight:900;
    font-size:18px;
}

.brand-text{
    display:flex;
    flex-direction:column;
}

.brand-name{
    font-size:20px;
    font-weight:800;
}

.brand-sub{
    color:var(--muted);
    font-size:12px;
}

/* ACCOUNT */

.account-area{
    position:relative;
}

.account-button{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid #345;
    background:#171717;
    color:white;
    border-radius:18px;
    padding:8px 12px;
    transition:.2s;
}

.account-button:hover{
    border-color:var(--cyan);
}

.account-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    object-fit:cover;
    background:#282828;
    border:1px solid #444;
    display:none;
}

.account-default-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#252525;
    border:1px solid #444;
    color:var(--cyan2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.account-name{
    color:var(--cyan2);
    font-weight:700;
    max-width:180px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.account-arrow{
    color:#888;
    font-size:12px;
}

.account-menu{
    position:absolute;
    right:0;
    top:calc(100% + 10px);
    width:220px;
    background:#1b1b1b;
    border:1px solid #3a3a3a;
    border-radius:18px;
    padding:8px;
    box-shadow:var(--shadow);
    display:none;
}

.account-menu.open{
    display:block;
}

.account-menu-user{
    padding:12px;
    border-bottom:1px solid #333;
    margin-bottom:6px;
}

.account-menu-username{
    font-weight:800;
    color:white;
}

.account-menu-email{
    margin-top:4px;
    color:#888;
    font-size:12px;
    word-break:break-word;
}

.account-option{
    width:100%;
    border:0;
    background:transparent;
    color:#ddd;
    text-align:left;
    padding:11px 12px;
    border-radius:12px;
}

.account-option:hover{
    background:#282828;
}

.account-option.danger{
    color:#ff7777;
}

/* HERO */

.hero{
    position:relative;
    min-height:520px;
    margin:20px 24px 0;
    border-radius:28px;
    overflow:hidden;
    background:#171717;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
}

.hero-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.72;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.92) 0%,
            rgba(0,0,0,.72) 38%,
            rgba(0,0,0,.25) 75%,
            rgba(0,0,0,.50) 100%
        ),
        linear-gradient(
            0deg,
            rgba(18,18,18,.94) 0%,
            transparent 45%
        );
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:680px;
    padding:110px 60px 60px;
}

.hero-label{
    color:var(--cyan2);
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:13px;
    margin-bottom:14px;
}

.hero-title{
    margin:0 0 18px;
    font-size:54px;
    line-height:1.03;
}

.hero-description{
    margin:0 0 22px;
    color:#d0d0d0;
    line-height:1.6;
    font-size:17px;
}

.hero-meta{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.hero-tag{
    border:1px solid #4a4a4a;
    background:rgba(20,20,20,.72);
    padding:8px 12px;
    border-radius:16px;
    color:#ddd;
    font-size:13px;
}

/* SEARCH */

.search-wrap{
    padding:28px 24px 8px;
}

.search{
    width:100%;
    max-width:720px;
    display:block;
    margin:auto;
    background:#1b1b1b;
    border:1px solid var(--border);
    border-radius:18px;
    color:white;
    padding:15px 18px;
    outline:none;
    transition:.2s;
}

.search:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(0,188,212,.12);
}

.search::placeholder{
    color:#777;
}

/* CONTENT */

.content{
    padding:25px 24px 50px;
}

.section{
    margin-top:28px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:16px;
}

.section-title{
    margin:0;
    font-size:28px;
}

.section-count{
    color:var(--muted);
    font-size:14px;
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
    gap:18px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    transition:.2s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#4a4a4a;
    box-shadow:var(--shadow);
}

.card-preview{
    height:145px;
    background:#111;
    position:relative;
    overflow:hidden;
}

.card-preview video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.card-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#666;
    background:
        radial-gradient(circle at center, #292929 0, #111 65%);
}

.card-type{
    position:absolute;
    left:10px;
    top:10px;
    padding:6px 9px;
    border-radius:12px;
    background:rgba(0,0,0,.75);
    border:1px solid #444;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
}

.card-body{
    padding:16px;
}

.card-title{
    margin:0 0 8px;
    font-size:18px;
    line-height:1.25;
}

.card-description{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    min-height:40px;
}

/* EMPTY */

.empty{
    display:none;
    border:1px dashed #444;
    border-radius:18px;
    padding:35px;
    text-align:center;
    color:#777;
}

/* PLAYER */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.open{
    display:flex;
}

.player{
    width:min(1100px,100%);
    background:#181818;
    border:1px solid #444;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.player-top{
    position:relative;
    background:#000;
}

.player video{
    width:100%;
    max-height:70vh;
    display:block;
    background:#000;
}

.close{
    position:absolute;
    top:14px;
    right:14px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid #555;
    background:rgba(0,0,0,.72);
    color:white;
    z-index:5;
    font-size:20px;
}

.player-info{
    padding:20px;
}

.player-title{
    margin:0 0 8px;
    font-size:28px;
}

.player-description{
    color:#bbb;
    line-height:1.5;
    margin:0;
}

/* ERROR */

.error{
    position:fixed;
    left:20px;
    right:20px;
    bottom:20px;
    z-index:5000;
    display:none;
    background:#261919;
    border:1px solid #6b3333;
    color:#ffb5b5;
    border-radius:14px;
    padding:14px 16px;
    box-shadow:var(--shadow);
}

/* RESPONSIVE */

@media(max-width:800px){

    .header{
        padding:0 16px;
    }

    .brand-sub{
        display:none;
    }

    .hero{
        margin:14px 14px 0;
        min-height:480px;
        border-radius:22px;
    }

    .hero-content{
        padding:85px 28px 50px;
    }

    .hero-title{
        font-size:40px;
    }

    .hero-description{
        font-size:15px;
    }

    .content,
    .search-wrap{
        padding-left:14px;
        padding-right:14px;
    }

    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .card-preview{
        height:120px;
    }

    .account-name{
        max-width:110px;
    }
}

@media(max-width:520px){

    .header{
        height:62px;
    }

    .brand-name{
        font-size:17px;
    }

    .brand-mark{
        width:36px;
        height:36px;
        border-radius:10px;
        font-size:15px;
    }

    .account-button{
        padding:6px 9px;
    }

    .account-default-avatar,
    .account-avatar{
        width:30px;
        height:30px;
    }

    .account-name{
        display:none;
    }

    .hero{
        min-height:430px;
    }

    .hero-content{
        padding:70px 22px 40px;
    }

    .hero-title{
        font-size:33px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card-preview{
        height:170px;
    }
}
</style>
</head>

/* =========================
   ERROR DISPLAY
========================= */

function showError(message){

    errorBox.textContent = message;

    errorBox.style.display =
        "block";

    clearTimeout(
        showError.timer
    );

    showError.timer =
        setTimeout(() => {

            errorBox.style.display =
                "none";

        }, 5000);
}

/* =========================
   ACCOUNT
========================= */

let currentUser = null;

function getPfpUrl(pfp){

    if(!pfp){
        return null;
    }

    if(
        pfp.startsWith("http://") ||
        pfp.startsWith("https://")
    ){
        return pfp;
    }

    if(
        pfp.startsWith("/")
    ){
        return AUTH_API + pfp;
    }

    return AUTH_API + "/" + pfp;
}

function getInitial(username){

    if(!username){
        return "U";
    }

    return username
        .trim()
        .charAt(0)
        .toUpperCase();
}

function updateAccountUI(user){

    currentUser = user;

    const username =
        user.username ||
        user.email?.split("@")[0] ||
        "user";

    const email =
        user.email ||
        username + "@knfoundation.org";

    accountName.textContent =
        "@" + username;

    menuUsername.textContent =
        "@" + username;

    menuEmail.textContent =
        email;

    accountDefaultAvatar.textContent =
        getInitial(username);

    const pfp =
        user.pfp ||
        user.profile_picture ||
        null;

    const pfpUrl =
        getPfpUrl(pfp);

    if(pfpUrl){

        accountAvatar.src =
            pfpUrl;

        accountAvatar.style.display =
            "block";

        accountDefaultAvatar.style.display =
            "none";

        accountAvatar.onerror =
            () => {

                accountAvatar.style.display =
                    "none";

                accountDefaultAvatar.style.display =
                    "flex";
            };

    }else{

        accountAvatar.style.display =
            "none";

        accountDefaultAvatar.style.display =
            "flex";
    }
}

        const response =
            await fetch(
                AUTH_API + "/api/me",
                {
                    method:"GET",
                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        if(!response.ok){

            localStorage.removeItem(
                TOKEN_KEY
            );

            redirectToAuth();

            return false;
        }

        const user =
            await response.json();

        updateAccountUI(user);

        return true;

    }catch(error){

        showError(
            "Unable to connect to Kn Foundation."
        );

        redirectToAuth();

        return false;
    }
}

/* =========================
   AUTH REDIRECT
========================= */

function redirectToAuth(){

    const returnUrl =
        window.location.href;

    const url =
        AUTH_PAGE +
        "?return=" +
        encodeURIComponent(
            returnUrl
        );

    window.location.href =
        url;
}

/* =========================
   LOGOUT
========================= */

async function logout(){

    const token =
        localStorage.getItem(
            TOKEN_KEY
        );

    try{

        if(token){

            await fetch(
                AUTH_API + "/api/logout",
                {
                    method:"POST",
                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );
        }

    }catch(error){
        /* Continue local logout anyway */
    }

    localStorage.removeItem(
        TOKEN_KEY
    );

    window.location.href =
        AUTH_PAGE +
        "?return=" +
        encodeURIComponent(
            window.location.href
        );
}

/* =========================
   BANNERS
========================= */

let currentBanner = 0;

function renderBanner(){

    const banner =
        banners[currentBanner];

    heroImage.src =
        banner.image;

    heroImage.alt =
        banner.title;

    heroLabel.textContent =
        banner.type;

    heroTitle.textContent =
        banner.title;

    heroDescription.textContent =
        banner.description;

    heroType.textContent =
        banner.type;

    heroCount.textContent =
        banner.count;
}

/*
   Banner changes automatically only.
   There are no manual controls.
*/

renderBanner();

setInterval(
    () => {

        currentBanner =
            (currentBanner + 1) %
            banners.length;

        renderBanner();

    },
    5000
);

/* =========================
   CARDS
========================= */

function createCard(item){

    const card =
        document.createElement("article");

    card.className =
        "card";

    const preview =
        document.createElement("div");

    preview.className =
        "card-preview";

    const video =
        document.createElement("video");

    video.src =
        item.file;

    video.muted =
        true;

    video.preload =
        "metadata";

    video.playsInline =
        true;

    video.addEventListener(
        "mouseenter",
        () => {

            video.play()
                .catch(() => {});
        }
    );

    video.addEventListener(
        "mouseleave",
        () => {

            video.pause();

            video.currentTime =
                0;
        }
    );

    video.addEventListener(
        "error",
        () => {

            video.remove();

            const placeholder =
                document.createElement("div");

            placeholder.className =
                "card-placeholder";

            placeholder.textContent =
                "Preview unavailable";

            preview.prepend(
                placeholder
            );

        },
        {
            once:true
        }
    );

    const type =
        document.createElement("div");

    type.className =
        "card-type";

    type.textContent =
        item.type === "series"
            ? "Series"
            : "Movie";

    preview.appendChild(
        video
    );

    preview.appendChild(
        type
    );

    const body =
        document.createElement("div");

    body.className =
        "card-body";

    const title =
        document.createElement("h3");

    title.className =
        "card-title";

    title.textContent =
        item.title;

    const description =
        document.createElement("div");

    description.className =
        "card-description";

    description.textContent =
        item.description;

    body.appendChild(
        title
    );

    body.appendChild(
        description
    );

    card.appendChild(
        preview
    );

    card.appendChild(
        body
    );

    card.addEventListener(
        "click",
        () => {

            openPlayer(item);
        }
    );

    return card;
}

/* =========================
   RENDER TITLES
========================= */

function renderTitles(){

    const query =
        searchInput.value
            .trim()
            .toLowerCase();

    const filtered =
        titles.filter(item => {

            return (
                item.title
                    .toLowerCase()
                    .includes(query)

                ||

                item.description
                    .toLowerCase()
                    .includes(query)
            );
        });

    const series =
        filtered.filter(
            item =>
                item.type === "series"
        );

    const movies =
        filtered.filter(
            item =>
                item.type === "movie"
        );

    seriesGrid.innerHTML =
        "";

    moviesGrid.innerHTML =
        "";

    series.forEach(
        item => {

            seriesGrid.appendChild(
                createCard(item)
            );
        }
    );

    movies.forEach(
        item => {

            moviesGrid.appendChild(
                createCard(item)
            );
        }
    );

    seriesCount.textContent =
        `${series.length} title${series.length === 1 ? "" : "s"}`;

    moviesCount.textContent =
        `${movies.length} title${movies.length === 1 ? "" : "s"}`;

    seriesEmpty.style.display =
        series.length === 0
            ? "block"
            : "none";

    moviesEmpty.style.display =
        movies.length === 0
            ? "block"
            : "none";
}

searchInput.addEventListener(
    "input",
    renderTitles
);

/* =========================
   PLAYER
========================= */

function openPlayer(item){

    playerTitle.textContent =
        item.title;

    playerDescription.textContent =
        item.description;

    playerVideo.src =
        item.file;

    playerModal.classList.add(
        "open"
    );

    playerVideo.play()
        .catch(() => {});
}

function closePlayer(){

    playerVideo.pause();

    playerVideo.removeAttribute(
        "src"
    );

    playerVideo.load();

    playerModal.classList.remove(
        "open"
    );
}

document
    .getElementById("closePlayer")
    .addEventListener(
        "click",
        closePlayer
    );

playerModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            playerModal
        ){

            closePlayer();
        }
    }
);

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){

            closePlayer();

            accountMenu.classList.remove(
                "open"
            );
        }
    }
);

/* =========================
   START
========================= */

async function start(){

    renderTitles();

    const authenticated =
        await checkAuth();

    if(!authenticated){
        return;
    }

    loading.style.display =
        "none";

    app.style.display =
        "block";
}

start();
</script>
