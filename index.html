<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart-Movies</title>
<style>
:root{--bg:#121212;--card:#202020;--cyan:#00bcd4;--cyan2:#00e5ff;--muted:#aaa;--border:#333;--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;font-family:Segoe UI,Roboto,Arial,sans-serif}
body{overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan2);outline-offset:2px}

#loading{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--cyan2);font-size:18px;text-align:center;padding:20px}
#loading button{background:var(--cyan);color:#000;border:0;border-radius:8px;padding:10px 18px;font-weight:700}
#app{display:none}

.header{position:sticky;top:0;z-index:1000;height:64px;display:flex;align-items:center;padding:0 28px;background:rgba(18,18,18,.96);border-bottom:1px solid var(--border);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:8px;background:var(--cyan);color:#000;font-weight:900;display:flex;align-items:center;justify-content:center}
.brand-name{font-size:20px;font-weight:800}

.hero{position:relative;min-height:480px;margin:20px 24px 0;border-radius:12px;overflow:hidden;background:#171717;border:1px solid var(--border)}
.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.7) 38%,rgba(0,0,0,.2) 80%),linear-gradient(0deg,rgba(18,18,18,.94) 0%,transparent 45%)}
.hero-content{position:relative;max-width:640px;padding:100px 56px 56px}
.hero-title{margin:0 0 16px;font-size:50px;line-height:1.05}
.hero-description{margin:0 0 20px;color:#d0d0d0;line-height:1.6;font-size:17px}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.tag{border:1px solid #4a4a4a;background:rgba(20,20,20,.72);padding:6px 12px;border-radius:8px;color:#ddd;font-size:13px}

.btn{border:0;border-radius:8px;padding:12px 26px;font-weight:800;font-size:16px}
.btn-primary{background:var(--cyan);color:#000}
.btn-primary:hover{background:var(--cyan2);box-shadow:0 0 18px rgba(0,229,255,.35)}
.btn-ghost{background:#2a2a2a;border:1px solid #444}
.btn-ghost:hover{border-color:var(--cyan)}

.search-wrap{padding:26px 24px 0}
.search{display:block;width:100%;max-width:720px;margin:auto;background:#1b1b1b;border:1px solid var(--border);border-radius:8px;padding:14px 18px;outline:none}
.search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,188,212,.12)}

.content{padding:10px 24px 50px}
.section{margin-top:28px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}
.section-title{margin:0;font-size:26px}
.section-count{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}
.empty{display:none;border:1px dashed #444;border-radius:8px;padding:30px;text-align:center;color:#777}

.card{padding:0;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:.2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),var(--shadow)}
.card-preview{position:relative;height:145px;background:#111}
.card-preview video{width:100%;height:100%;object-fit:cover;display:block}
.card-placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:#666}
.card-type{position:absolute;left:10px;top:10px;padding:5px 9px;border-radius:6px;background:rgba(0,0,0,.75);border:1px solid #444;font-size:11px;font-weight:700;pointer-events:none}
.card-body{padding:14px 16px 16px}
.card-title{margin:0 0 6px;font-size:17px;line-height:1.25}
.card-description{color:var(--muted);font-size:13px;line-height:1.5}

/* Próximamente */
.upcoming{padding:26px 24px 0}
.upcoming .section-title{margin-bottom:14px}
.up-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.up-card{position:relative;padding:20px 22px;background:linear-gradient(135deg,#1d2a2d,#1b1b1b);border:1px solid #2c4348;border-left:3px solid var(--cyan);border-radius:8px}
.up-badge{display:inline-block;margin-bottom:10px;padding:4px 10px;border-radius:6px;background:rgba(0,188,212,.14);border:1px solid var(--cyan);color:var(--cyan2);font-size:12px;font-weight:700}
.up-title{margin:0 0 6px;font-size:20px}
.up-desc{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.detail-description:empty{display:none}

/* Detalle (estilo Plex) */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82);z-index:3000}
.modal.open{display:flex}
.detail{position:relative;width:min(980px,100%);max-height:92vh;overflow:auto;background:#181818;border:1px solid #444;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
.detail-backdrop{position:relative;height:340px;background:#000}
.detail-backdrop video{width:100%;height:100%;object-fit:cover;display:block;opacity:.8}
.detail-backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#181818 0%,rgba(24,24,24,.2) 60%,transparent)}
.detail-body{position:relative;margin-top:-90px;padding:0 36px 32px;z-index:2}
.detail-title{margin:0 0 12px;font-size:38px;line-height:1.1}
.detail-description{color:#ccc;line-height:1.65;max-width:70ch;margin:0 0 22px}
.actions{display:flex;gap:12px}
.close{position:absolute;top:14px;right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid #555;background:rgba(0,0,0,.72);font-size:20px}
.episodes{margin-top:30px}
.episodes h3{margin:0 0 12px;font-size:18px}
.ep-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.ep{text-align:left;background:#222;border:1px solid var(--border);border-radius:8px;padding:11px 14px;font-size:14px}
.ep:hover{border-color:var(--cyan)}
.ep.current{border-color:var(--cyan2);color:var(--cyan2)}

/* Reproductor */
#playerModal{z-index:4000;background:rgba(0,0,0,.92)}
.player{position:relative;width:min(1100px,100%);background:#000;border:1px solid #444;border-radius:12px;overflow:hidden}
.player video{display:block;width:100%;max-height:78vh;background:#000}
.player-title{margin:0;padding:14px 20px;background:#181818;font-size:20px}

.error{position:fixed;left:20px;right:20px;bottom:20px;z-index:5000;display:none;background:#261919;border:1px solid #6b3333;color:#ffb5b5;border-radius:8px;padding:14px 16px}

@media(max-width:800px){
 .header{padding:0 16px}
 .hero{margin:14px 14px 0;min-height:440px}
 .hero-content{padding:80px 26px 44px}
 .hero-title{font-size:36px}
 .content,.search-wrap{padding-left:14px;padding-right:14px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .card-preview{height:120px}
 .detail-backdrop{height:220px}
 .detail-body{padding:0 20px 24px;margin-top:-60px}
 .detail-title{font-size:28px}
}
@media(max-width:520px){
 .grid{grid-template-columns:1fr}
 .card-preview{height:170px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="loading">Cargando Smart-Movies…</div>

<div id="app">
 <header class="header">
  <div class="brand">
   <div class="brand-mark">SM</div>
   <div class="brand-name">Smart-Movies</div>
  </div>
 </header>

 <main>
  <section class="hero">
   <img id="heroImage" class="hero-image" src="banner 1.JPG" alt="">
   <div class="hero-overlay"></div>
   <div class="hero-content">
    <h1 class="hero-title" id="heroTitle"></h1>
    <p class="hero-description" id="heroDescription"></p>
    <div class="tags">
     <span class="tag" id="heroType"></span>
     <span class="tag" id="heroCount"></span>
    </div>
    <button class="btn btn-primary" id="heroButton" type="button">Ver detalles</button>
   </div>
  </section>

  <section class="upcoming">
   <h2 class="section-title">Próximamente</h2>
   <div class="up-grid" id="upGrid"></div>
  </section>

  <div class="search-wrap">
   <input id="searchInput" class="search" type="search" placeholder="Buscar películas y series…" autocomplete="off">
  </div>

  <div class="content">
   <section class="section">
    <div class="section-head"><h2 class="section-title">Series</h2><div class="section-count" id="seriesCount"></div></div>
    <div class="grid" id="seriesGrid"></div>
    <div class="empty" id="seriesEmpty">No se encontraron series.</div>
   </section>
   <section class="section">
    <div class="section-head"><h2 class="section-title">Películas</h2><div class="section-count" id="moviesCount"></div></div>
    <div class="grid" id="moviesGrid"></div>
    <div class="empty" id="moviesEmpty">No se encontraron películas.</div>
   </section>
  </div>
 </main>
</div>

<!-- Detalle -->
<div class="modal" id="detailModal">
 <div class="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <button class="close" id="closeDetail" aria-label="Cerrar" type="button">×</button>
  <div class="detail-backdrop"><video id="detailVideo" muted loop playsinline></video></div>
  <div class="detail-body">
   <h2 class="detail-title" id="detailTitle"></h2>
   <div class="tags"><span class="tag" id="detailType"></span><span class="tag" id="detailDuration"></span></div>
   <p class="detail-description" id="detailDescription"></p>
   <div class="actions">
    <button class="btn btn-primary" id="watchButton" type="button">▶ Ver</button>
    <button class="btn btn-ghost" id="backButton" type="button">Volver</button>
   </div>
   <div class="episodes" id="episodes">
    <h3>Episodios</h3>
    <div class="ep-list" id="epList"></div>
   </div>
  </div>
 </div>
</div>

<!-- Reproductor -->
<div class="modal" id="playerModal">
 <div class="player">
  <button class="close" id="closePlayer" aria-label="Cerrar reproductor" type="button">×</button>
  <video id="playerVideo" controls playsinline></video>
  <h2 class="player-title" id="playerTitle"></h2>
 </div>
</div>

<div class="error" id="errorBox"></div>

<script>
/* ===== CONFIGURACIÓN ===== */
const AUTH_API = "https://titans-latter-opinions-invitations.trycloudflare.com";
const TOKEN_KEY = "knfoundation_token";
const AUTH_PAGE = "https://smartium25.github.io/auth";
const PREVIEW_START = 60; /* la vista previa empieza en el minuto 1 */

const VIDEO_EXT = /\.(mp4|webm|ogg|mov|m4v)$/i;
/* Archivos de la carpeta que NO se muestran */
const EXCLUDE = ["pepitothemovie.mp4"];
/* Solo si la autodetección del repositorio falla (por ejemplo dominio propio) */
const REPO_OVERRIDE = {owner:"", repo:"", path:""};
/* Descripciones opcionales, por título (nombre del archivo sin extensión) */
const DESCRIPTIONS = {
 "French Toast y pepito the movie": "French Toast y Pepito se unen en una nueva aventura."
};
/* Se usa solo si GitHub no responde (límite de peticiones o ejecución local) */
const FALLBACK_FILES = [
 "Día 1, Videos Sentimentales.mp4","Día 2, Videos Sentimentales.mp4","Día 3, Videos Sentimentales.mp4","Día 4, Videos Sentimentales.mp4",
 "Día 5, Videos sentimentales- El regresar de la Familia Peluche.mp4","Día 6, Videos Sentimentales- El Regreso De la Familia Peluche.mp4",
 "Día 7, Videos Sentimentales- El Regresar De la Familia Peluche .mp4","Día 8, Videos Sentimentales- El regreso de la Familia Peluche.mp4",
 "Día 9, Videos Sentimentales- El Regresar De la Familia Peluche.mp4","French Toast y pepito the movie.mp4"
];

const banners = [
 {file:"Día 1, Videos Sentimentales.mp4", image:"banner 1.JPG", title:"Videos Sentimentales", description:"Sigue la historia a lo largo de la serie Videos Sentimentales.", type:"Serie"},
 {image:"banner 2.JPG", title:"Pepito: The Movie 2", description:"Pepito regresa para una nueva aventura.", type:"Próximamente"},
 {file:"French Toast y pepito the movie.mp4", image:"banner 3.JPG", title:"Pepito and French Toast", description:"Pepito y French Toast se unen para una nueva aventura.", type:"Película"}
];

/* Solo publicidad: no tienen vídeo */
const upcoming = [
 {title:"Pepito: The Movie Remastered", description:"La película de Pepito, remasterizada."},
 {title:"Pepito: The Movie 2", description:"Pepito regresa para una nueva aventura."}
];

let titles = [];

/* ===== ELEMENTOS ===== */
const $ = id => document.getElementById(id);
const loading=$("loading"), app=$("app"), errorBox=$("errorBox");
const searchInput=$("searchInput");
const detailModal=$("detailModal"), detailVideo=$("detailVideo");
const playerModal=$("playerModal"), playerVideo=$("playerVideo");

const url = f => encodeURI(f);
const normalize = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const typeLabel = t => t==="series" ? "Serie" : "Película";

function showError(msg){
 errorBox.textContent = msg;
 errorBox.style.display = "block";
 clearTimeout(showError.t);
 showError.t = setTimeout(()=>errorBox.style.display="none",5000);
}

function fmtDuration(sec){
 if(!isFinite(sec) || !sec) return "";
 const m = Math.round(sec/60);
 return m>=60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`;
}

/* Coloca un vídeo en el minuto 1 (o al inicio si dura menos) */
function previewStart(v){
 return v.duration && v.duration > PREVIEW_START+2 ? PREVIEW_START : 0.5;
}
function setPreviewSrc(v,file){
 v.src = url(file) + "#t=" + PREVIEW_START;
 v.addEventListener("loadedmetadata",()=>{ v.currentTime = previewStart(v); },{once:true});
}

/* ===== AUTENTICACIÓN ===== */
function goAuth(){
 location.replace(AUTH_PAGE + "?redirect=" + encodeURIComponent(location.href));
}

function failScreen(msg){
 loading.style.display = "flex";
 loading.innerHTML = "";
 const p = document.createElement("div"); p.textContent = msg;
 const b = document.createElement("button"); b.textContent = "Reintentar"; b.onclick = ()=>location.reload();
 loading.append(p,b);
}

async function checkAuth(){
 const token = localStorage.getItem(TOKEN_KEY);
 if(!token){ goAuth(); return false; }
 const ctrl = new AbortController();
 const timer = setTimeout(()=>ctrl.abort(),8000);
 try{
  const r = await fetch(AUTH_API+"/api/me",{headers:{Authorization:"Bearer "+token},signal:ctrl.signal});
  if(r.status===401){ localStorage.removeItem(TOKEN_KEY); goAuth(); return false; }
  if(!r.ok){ failScreen("El servidor de cuentas no responde."); return false; }
  return true;
 }catch(e){
  failScreen("No se pudo conectar con Kn Foundation.");
  return false;
 }finally{ clearTimeout(timer); }
}

/* ===== CATÁLOGO (carpeta del repositorio) ===== */
function repoInfo(){
 const owner = location.hostname.split(".")[0];
 const parts = location.pathname.split("/").filter(Boolean);
 if(parts.length && /\.[a-z0-9]+$/i.test(parts[parts.length-1])) parts.pop();
 const repo = parts.shift() || owner + ".github.io";
 return {
  owner: REPO_OVERRIDE.owner || owner,
  repo: REPO_OVERRIDE.repo || repo,
  path: REPO_OVERRIDE.path || parts.join("/")
 };
}

/* Título = nombre del archivo sin extensión; si empieza con D, es serie */
function buildTitles(names){
 return names
  .filter(n => VIDEO_EXT.test(n) && !EXCLUDE.includes(n))
  .sort((a,b) => a.localeCompare(b,"es",{numeric:true}))
  .map(file => {
   const title = file.replace(/\.[^.]+$/,"").trim();
   return {file, title, description: DESCRIPTIONS[title] || "", type: /^d/i.test(file) ? "series" : "movie"};
  });
}

async function loadTitles(){
 const key = "sm_files";
 try{
  const c = JSON.parse(sessionStorage.getItem(key) || "null");
  if(c && Date.now() - c.t < 600000) return buildTitles(c.names);
 }catch(e){}
 try{
  const {owner,repo,path} = repoInfo();
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURI(path)}`);
  if(!r.ok) throw new Error(r.status);
  const names = (await r.json()).filter(f => f.type === "file").map(f => f.name);
  try{ sessionStorage.setItem(key, JSON.stringify({t:Date.now(), names})); }catch(e){}
  return buildTitles(names);
 }catch(e){
  return buildTitles(FALLBACK_FILES);
 }
}

/* ===== BANNERS ===== */
let currentBanner = 0;
function renderBanner(){
 const b = banners[currentBanner];
 $("heroImage").src = b.image;
 $("heroTitle").textContent = b.title;
 $("heroDescription").textContent = b.description;
 $("heroType").textContent = b.type;
 const n = titles.filter(t => t.type === "series").length;
 $("heroCount").textContent = b.type === "Serie" ? (n ? n + " episodios" : "Serie")
  : b.type === "Próximamente" ? "Muy pronto" : "Película destacada";
 const item = b.file && titles.find(t => t.file === b.file);
 $("heroButton").style.display = item ? "" : "none";
}
$("heroButton").addEventListener("click",()=>{
 const b = banners[currentBanner];
 const item = b.file && titles.find(t => t.file === b.file);
 if(item) openDetail(item);
});

function renderUpcoming(){
 $("upGrid").replaceChildren(...upcoming.map(u => {
  const c = document.createElement("div"); c.className = "up-card";
  const badge = document.createElement("span"); badge.className = "up-badge"; badge.textContent = "Próximamente";
  const h = document.createElement("h3"); h.className = "up-title"; h.textContent = u.title;
  const d = document.createElement("p"); d.className = "up-desc"; d.textContent = u.description;
  c.append(badge,h,d);
  return c;
 }));
}

/* ===== TARJETAS ===== */
function createCard(item){
 const card = document.createElement("button");
 card.type = "button";
 card.className = "card";

 const preview = document.createElement("div");
 preview.className = "card-preview";

 const video = document.createElement("video");
 video.muted = true; video.preload = "metadata"; video.playsInline = true;
 setPreviewSrc(video,item.file);
 video.addEventListener("error",()=>{
  video.remove();
  const ph = document.createElement("div");
  ph.className = "card-placeholder";
  ph.textContent = "Vista previa no disponible";
  preview.prepend(ph);
 },{once:true});

 card.addEventListener("mouseenter",()=>video.play().catch(()=>{}));
 card.addEventListener("mouseleave",()=>{ video.pause(); video.currentTime = previewStart(video); });

 const type = document.createElement("div");
 type.className = "card-type";
 type.textContent = typeLabel(item.type);
 preview.append(video,type);

 const body = document.createElement("div");
 body.className = "card-body";
 const h = document.createElement("h3"); h.className="card-title"; h.textContent=item.title;
 const d = document.createElement("div"); d.className="card-description"; d.textContent=item.description;
 body.append(h);
 if(item.description) body.append(d);

 card.append(preview,body);
 card.addEventListener("click",()=>openDetail(item));
 return card;
}

function renderTitles(){
 const q = normalize(searchInput.value.trim());
 const filtered = titles.filter(i => normalize(i.title).includes(q) || normalize(i.description).includes(q));
 const series = filtered.filter(i=>i.type==="series");
 const movies = filtered.filter(i=>i.type==="movie");

 $("seriesGrid").replaceChildren(...series.map(createCard));
 $("moviesGrid").replaceChildren(...movies.map(createCard));

 $("seriesCount").textContent = `${series.length} ${series.length===1?"título":"títulos"}`;
 $("moviesCount").textContent = `${movies.length} ${movies.length===1?"título":"títulos"}`;
 $("seriesEmpty").style.display = series.length ? "none" : "block";
 $("moviesEmpty").style.display = movies.length ? "none" : "block";
}
searchInput.addEventListener("input",renderTitles);

/* ===== DETALLE ===== */
let currentItem = null;

function openDetail(item){
 currentItem = item;
 $("detailTitle").textContent = item.title;
 $("detailDescription").textContent = item.description;
 $("detailType").textContent = typeLabel(item.type);
 $("detailDuration").textContent = "";

 setPreviewSrc(detailVideo,item.file);
 detailVideo.addEventListener("loadedmetadata",()=>{
  $("detailDuration").textContent = fmtDuration(detailVideo.duration);
 },{once:true});
 detailVideo.play().catch(()=>{});

 const eps = $("episodes");
 if(item.type==="series"){
  eps.style.display = "block";
  $("epList").replaceChildren(...titles.filter(t=>t.type==="series").map(t=>{
   const b = document.createElement("button");
   b.type = "button";
   b.className = "ep" + (t===item ? " current" : "");
   b.textContent = t.title;
   b.addEventListener("click",()=>openDetail(t));
   return b;
  }));
 }else{
  eps.style.display = "none";
 }

 detailModal.classList.add("open");
 document.body.style.overflow = "hidden";
 $("watchButton").focus();
}

function closeDetail(){
 detailVideo.pause();
 detailVideo.removeAttribute("src");
 detailVideo.load();
 detailModal.classList.remove("open");
 document.body.style.overflow = "";
}

$("closeDetail").addEventListener("click",closeDetail);
$("backButton").addEventListener("click",closeDetail);
detailModal.addEventListener("click",e=>{ if(e.target===detailModal) closeDetail(); });
$("watchButton").addEventListener("click",()=>{ if(currentItem) openPlayer(currentItem); });

/* ===== REPRODUCTOR ===== */
function openPlayer(item){
 detailVideo.pause();
 $("playerTitle").textContent = item.title;
 playerVideo.src = url(item.file);
 playerModal.classList.add("open");
 playerVideo.play().catch(()=>{});
}

function closePlayer(){
 playerVideo.pause();
 playerVideo.removeAttribute("src");
 playerVideo.load();
 playerModal.classList.remove("open");
 if(detailModal.classList.contains("open")) detailVideo.play().catch(()=>{});
}

playerVideo.addEventListener("error",()=>{
 if(playerVideo.getAttribute("src")) showError("No se pudo cargar el vídeo.");
});
$("closePlayer").addEventListener("click",closePlayer);
playerModal.addEventListener("click",e=>{ if(e.target===playerModal) closePlayer(); });

document.addEventListener("keydown",e=>{
 if(e.key!=="Escape") return;
 if(playerModal.classList.contains("open")) closePlayer();
 else if(detailModal.classList.contains("open")) closeDetail();
});

/* ===== INICIO ===== */
async function start(){
 if(!(await checkAuth())) return;
 titles = await loadTitles();
